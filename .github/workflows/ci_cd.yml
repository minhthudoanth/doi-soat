name: Kingfood SCM Automated CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Code Syntax and Imports
        run: |
          python -c "import app, config, starrocks_db, sheet_sync; print('All core modules imported successfully!')"

      - name: Build Docker Container
        run: |
          docker build -t kingfood-scm-bot:latest .
